# Sürekli doğrulama: development/staging/main'e giden PR'larda ve bu dallara
# push'larda typecheck + build + duman testi çalışır.
# Yayına almayı Vercel yapar (main = production), burada deploy YOK.
name: ci

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buyur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lockfile npm 11 ile yazılıyor; ayrıca npm, platforma göre atlanan
      # opsiyonel bağımlılıkları (tailwind oxide zinciri, @emnapi/*) lock'a
      # eksik yazabiliyor (npm/cli#4828) ve `npm ci` senkron hatası veriyor.
      # Bu yüzden CI npm 11 + `npm install` kullanır - sürümleri yine lockfile
      # belirler, eksik opsiyoneller tamamlanır.
      - run: npm install -g npm@11

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run build

      - run: npm run smoke
